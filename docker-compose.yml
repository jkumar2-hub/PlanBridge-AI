version: '3.8'

services:
  planbridge-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planbridge-oil-india
    restart: unless-stopped
    ports:
      - "8000:8000"   # FastAPI REST API & Swagger UI (/docs)
      - "8501:8501"   # Streamlit Interactive Operations Dashboard
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIDENCE_THRESHOLD=0.75
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - planbridge-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  planbridge-data:
    driver: local
