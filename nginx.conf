# Production Nginx Configuration for PlanBridge AI
# Reverse proxy routing for FastAPI (/api/) and Streamlit (/) with full WebSocket support.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream streamlit_backend {
        server 127.0.0.1:8501;
    }

    upstream fastapi_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;

        # Client body size for file uploads (.csv, .xlsx, large logs)
        client_max_body_size 50M;

        # 1. FastAPI REST API & Swagger Docs
        location /api/ {
            proxy_pass http://fastapi_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://fastapi_backend/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://fastapi_backend/openapi.json;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://fastapi_backend/health;
            proxy_set_header Host $host;
        }

        # 2. Streamlit WebSockets (Critical for Live Dashboard Interaction)
        location /_stcore/stream {
            proxy_pass http://streamlit_backend/_stcore/stream;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        # 3. Streamlit Frontend
        location / {
            proxy_pass http://streamlit_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
